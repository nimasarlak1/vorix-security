<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VORIX.SECURITY</title>

  <meta name="description" content="VORIX.SECURITY - امنیت، نرم‌افزار و فناوری">
  <meta name="theme-color" content="#050505">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #050505;
      color: #ffffff;
      font-family: Arial, Tahoma, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    main {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    .logo {
      font-size: clamp(42px, 9vw, 90px);
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 25px;
    }

    .line {
      width: 80px;
      height: 3px;
      background: #ffffff;
      margin: 0 auto 30px;
    }

    h1 {
      font-size: clamp(24px, 5vw, 42px);
      margin-bottom: 18px;
    }

    p {
      font-size: clamp(16px, 3vw, 21px);
      color: #bdbdbd;
      line-height: 1.9;
      margin-bottom: 35px;
    }

    .status {
      display: inline-block;
      border: 1px solid #333;
      border-radius: 50px;
      padding: 12px 24px;
      color: #ccc;
      font-size: 15px;
    }

    footer {
      margin-top: 70px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main>
    <div class="logo">VORIX.SECURITY</div>

    <div class="line"></div>

    <h1>امنیت در دنیای دیجیتال</h1>

    <p>
      راهکارهای امنیتی، نرم‌افزار و فناوری
      برای ساختن آینده‌ای امن‌تر.
    </p>

    <div class="status">
      VORIX.SECURITY — ONLINE
    </div>

    <footer>
      © 2026 VORIX.SECURITY
    </footer>
  </main>

</body>
</html>
