  <style>
    :root {
      --bg: #070b14;
      --bg-soft: #0d1322;
      --card: #111827;
      --border: #263247;
      --text: #f5f7fb;
      --muted: #9ba8bc;
      --accent: #63e6be;
      --accent-2: #60a5fa;
      --max: 1180px;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Tahoma,
        Arial,
        sans-serif;
      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(96, 165, 250, 0.12),
          transparent 35%
        ),
        radial-gradient(
          circle at 90% 30%,
          rgba(99, 230, 190, 0.08),
          transparent 30%
        ),
        var(--bg);
      color: var(--text);
      line-height: 1.9;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(92%, var(--max));
      margin-inline: auto;
    }

    .skip-link {
      position: absolute;
      right: -9999px;
      top: 10px;
      z-index: 999;
      background: var(--accent);
      color: #06110d;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
    }

    .skip-link:focus {
      right: 10px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 11, 20, 0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      direction: ltr;
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .logo span {
      color: var(--accent);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    nav a {
      color: var(--muted);
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    nav a:hover,
    nav a:focus {
      color: var(--text);
    }

    .nav-button {
      padding: 8px 16px;
      border: 1px solid var(--accent);
      border-radius: 10px;
      color: var(--accent);
    }

    .hero {
      padding: 120px 0 100px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      align-items: center;
      gap: 70px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 13px;
      border: 1px solid rgba(99,230,190,0.25);
      background: rgba(99,230,190,0.06);
      color: var(--accent);
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: bold;
      margin-bottom: 22px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    h1 {
      direction: ltr;
      text-align: right;
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: 1;
      letter-spacing: -0.05em;
      margin-bottom: 26px;
    }

    h1 span {
      color: var(--accent);
    }

    .hero-text {
      max-width: 650px;
      color: var(--muted);
      font-size: 1.15rem;
      margin-bottom: 32px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 12px 20px;
      border-radius: 11px;
      font-weight: bold;
      transition: transform 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button-primary {
      background: var(--accent);
      color: #06110d;
    }

    .button-secondary {
      border: 1px solid var(--border);
      background: var(--bg-soft);
      color: var(--text);
    }

    .security-card {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background:
        linear-gradient(
          145deg,
          rgba(96,165,250,0.12),
          rgba(99,230,190,0.04)
        ),
        var(--card);
      box-shadow: 0 30px 80px rgba(0,0,0,0.35);
    }

    .shield {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: rgba(99,230,190,0.1);
      color: var(--accent);
      font-size: 2rem;
      margin-bottom: 22px;
    }

    .security-card h2 {
      margin-bottom: 10px;
    }

    .security-card p {
      color: var(--muted);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.9rem;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      background: var(--accent);
      border-radius: 50%;
    }

    section {
      padding: 90px 0;
    }

    .section-header {
      max-width: 700px;
      margin-bottom: 42px;
    }

    .section-header h2 {
      font-size: clamp(2rem, 4vw, 3.2rem);
      line-height: 1.2;
      margin-bottom: 14px;
    }

    .section-header p {
      color: var(--muted);
      font-size: 1.05rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
